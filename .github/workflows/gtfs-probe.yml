name: GTFS probe
on:
  push:
    branches: ['probe/gtfs-feed']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: route
        run: |
          B=https://grapp-bridge-production.up.railway.app
          curl -sS -m 20 "$B/mpv/zlin" > idzk.json
          P=$(node -e 'const z=JSON.parse(require("fs").readFileSync("idzk.json"));const it=z.find(x=>String(x.cr||"").replace(/<[^>]*>/g,"").trim()==="DSZO");const f=String(it.cn||"").split("|");process.stdout.write(f[0]+" "+f[2]+" "+it.cat)')
          set -- $P; echo "PG params L$1 run$2 cat$3"
          curl -sS -m 25 "$B/mpv/zlin/route?num1=$1&num2=$2&cat=$3" -o r.json -w "PG route http=%{http_code} size=%{size_download} time=%{time_total}\n"
          node -e 'let d=null;try{d=JSON.parse(require("fs").readFileSync("r.json"))}catch(e){};console.log("PG shape",d&&d.shape?d.shape.length:"žádný",d&&d.shape?JSON.stringify(d.shape.slice(0,2)):require("fs").readFileSync("r.json","utf8").slice(0,100))'
