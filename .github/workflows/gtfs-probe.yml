name: GTFS probe
on:
  push:
    branches: ['probe/gtfs-feed']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: match
        run: |
          B=https://grapp-bridge-production.up.railway.app
          curl -sS -m 20 "$B/dszo" > dszo.json
          curl -sS -m 20 "$B/mpv/zlin" > idzk.json
          node -e '
          const dszo=JSON.parse(require("fs").readFileSync("dszo.json"));
          const idzk=JSON.parse(require("fs").readFileSync("idzk.json"));
          console.log("PG dszo",dszo.length,"idzk",idzk.length);
          const CN={line:0,shortLine:1,run:2,lastStop:3,dest:9};
          // dopravci v idzk
          const carriers={};for(const it of idzk){const c=String(it.cr||"").replace(/<[^>]*>/g,"").trim();carriers[c]=(carriers[c]||0)+1}
          console.log("PG carriers",JSON.stringify(carriers));
          const idz=idzk.map(it=>{const f=String(it.cn||"").split("|");return {short:f[CN.shortLine],line:f[CN.line],run:f[CN.run],dest:f[CN.dest],cr:String(it.cr||"").replace(/<[^>]*>/g,"").trim(),x:it.x,y:it.y,cat:it.cat}});
          function hav(a,b,c,d){const R=6371000,r=Math.PI/180;const dLat=(c-a)*r,dLon=(d-b)*r;const h=Math.sin(dLat/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
          const short=s=>/^\d{6}$/.test(s)?s.slice(-3):s;
          let matched=0;
          for(const v of dszo){
            const cands=idz.filter(i=>short(i.short||i.line)===String(v.line)&&hav(v.lat,v.lon,i.x,i.y)<300);
            const sameDest=cands.filter(i=>i.dest===v.destination);
            const best=(sameDest[0]||cands[0]);
            if(best)matched++;
            if(v.vehicle&&matched<=6)console.log("PG m",v.line,JSON.stringify(v.destination),"->",best?`${best.line}/${best.run} cr=${best.cr} dest=${JSON.stringify(best.dest)} d=${Math.round(hav(v.lat,v.lon,best.x,best.y))}`:"NIC","cand="+cands.length);
          }
          console.log("PG spárováno",matched,"/",dszo.length);
          '
