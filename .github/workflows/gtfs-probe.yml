name: GTFS probe
on:
  push:
    branches: ['probe/gtfs-feed']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: { ref: feat/dszo }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --silent
      - name: server
        run: |
          PORT=3999 node server.js > s.log 2>&1 &
          sleep 8
          node -e '
          (async()=>{const B="http://localhost:3999";
          const d=await (await fetch(`${B}/dszo`)).json();
          let okActive=0,okMatch=0,n=0;
          for(const v of d){n++;
            const t=await (await fetch(`${B}/dszo/trip?vuz=${v.vehicle}&zast=${v.station}&zpozdeni=${v.delay}&nizkopodlazni=${v.lowlevel}`)).json();
            if(t.active>=0){okActive++; if(t.stops[t.active]?.name===v.stop) okMatch++;}
            if(n<=5)console.log("PG v",v.vehicle,"L"+v.line,"stop",v.stop,"| active",t.active,t.stops?.[t.active]?.name||"-","stops",t.stops?.length);
          }
          console.log("PG shrnutí n",n,"sAktivní",okActive,"aktivníSedí",okMatch);
          })()'
