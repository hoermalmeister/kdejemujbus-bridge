name: GTFS probe
on:
  push:
    branches: ['probe/gtfs-feed']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: { ref: feat/dszo }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --silent
      - name: server
        run: |
          PORT=3999 node server.js > s.log 2>&1 &
          sleep 8
          node -e '
          (async()=>{const B="http://localhost:3999";
          const d=await (await fetch(`${B}/dszo`)).json();
          console.log("PG dszo",Array.isArray(d)?d.length:JSON.stringify(d).slice(0,120));
          if(Array.isArray(d)&&d.length){
            console.log("PG heading",d.filter(v=>v.heading!=null).length,"dest",d.filter(v=>v.destination).length,"stop",d.filter(v=>v.stop).length);
            console.log("PG v0",JSON.stringify(d[0]));
            const v=d[0];
            const t=await (await fetch(`${B}/dszo/trip?vuz=${v.vehicle}&zast=${v.station}&zpozdeni=${v.delay}&nizkopodlazni=${v.lowlevel}`)).json();
            console.log("PG trip stops",t.stops?.length,"active",t.active,JSON.stringify(t.stops?.[t.active]),JSON.stringify(t.stops?.slice(0,2)));
            console.log("PG aktStop vozu",v.stop);
          }})()'
          grep -iE "dszo|error|chyba" s.log | head -4 | sed 's/^/PG log /'
