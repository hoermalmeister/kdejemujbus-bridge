name: GTFS probe
on:
  push:
    branches: ['probe/gtfs-feed']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: route
        run: |
          B=https://grapp-bridge-production.up.railway.app
          curl -sS -m 20 "$B/mpv/zlin" > idzk.json
          node -e '
          (async()=>{
          const idzk=JSON.parse(require("fs").readFileSync("idzk.json"));
          const pick=(cr)=>{const it=idzk.find(x=>String(x.cr||"").replace(/<[^>]*>/g,"").trim()===cr && !x.external);const f=String(it.cn||"").split("|");return {line:f[0],run:f[2],cat:it.cat,dest:f[9]};};
          for(const cr of ["DSZO","ARRIVA, pr. Zlín"]){
            const t=pick(cr);
            const u=`${B}/mpv/zlin/route?num1=${t.line}&num2=${t.run}&cat=${t.cat}`;
            try{const r=await fetch(u);const txt=await r.text();let sh=null;try{sh=JSON.parse(txt).shape}catch(e){}
            console.log("PG",cr,"L"+t.line+"/"+t.run+" cat"+t.cat,"->",r.status,"shape",sh?sh.length:("raw:"+txt.slice(0,80)));}
            catch(e){console.log("PG",cr,"ERR",String(e).slice(0,80))}
          }
          })()
          '
