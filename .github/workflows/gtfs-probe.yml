name: GTFS probe
on:
  push:
    branches: ['probe/gtfs-feed']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: { ref: feat/dpmhk }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --silent
      - name: server
        run: |
          PORT=3999 node server.js > s.log 2>&1 &
          sleep 8
          node -e '
          (async()=>{const B="http://localhost:3999";
          const d=await (await fetch(`${B}/dpmhk`)).json();
          console.log("PG dpmhk",d.length,"cíl",d.filter(v=>v.destination).length,"sTrasou",d.filter(v=>v.lineId&&v.routeId).length,"dir",d.filter(v=>v.heading!=null).length);
          console.log("PG v0",JSON.stringify(d.find(v=>v.routeId)));
          const v=d.find(v=>v.lineId&&v.routeId);
          const r=await fetch(`${B}/dpmhk/route?lineId=${v.lineId}&routeId=${v.routeId}`);const t=await r.json();
          console.log("PG trasa",r.status,"bodů",t.shape?.length,JSON.stringify(t.shape?.slice(0,2)));
          })()'
          grep -iE "dpmhk|error|chyba" s.log | head -3 | sed 's/^/PG log /'
