name: GTFS probe
on:
  push:
    branches: ['probe/gtfs-feed']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: map
        run: |
          B=https://dpmhk.qrbus.me/index
          H=(-H 'referer: https://dpmhk.qrbus.me/' -H 'x-requested-with: XMLHttpRequest' -H 'user-agent: Mozilla/5.0')
          curl -sS -m 20 "${H[@]}" "$B/getAllRtdVehicles" > v.json
          curl -sS -m 30 "${H[@]}" "$B/getAllLines" > lines.json
          curl -sS -m 20 "${H[@]}" "$B/getAllStops" > stops.json
          node -e '
          (async()=>{
          const veh=JSON.parse(require("fs").readFileSync("v.json")).vehicles.filter(v=>v.gpsi===0&&v.vp===1);
          const cat=JSON.parse(require("fs").readFileSync("lines.json"));
          const lines=cat.lines||cat;
          console.log("PG lines",lines.length,"sample keys",Object.keys(lines[0]).join(","));
          // index lineId -> {routeName -> {id,endName}}
          const idx=new Map();
          for(const L of lines){const m=new Map();for(const r of L.routes||[])m.set(String(r.name),{id:r.id,endName:r.endName||r.endName2});idx.set(L.id,{end:L.endName,routes:m});}
          let hit=0,both=0;const ex=[];
          for(const v of veh){const L=idx.get(v.psi);if(!L)continue;const r=L.routes.get(String(v.rn));if(r){both++;if(ex.length<5)ex.push(`${v.ln}/${v.rn}->route ${r.id} cíl ${r.endName||L.end}`);}if(L)hit++;}
          console.log("PG lineHit",hit,"/",veh.length,"routeHit",both);
          ex.forEach(e=>console.log("PG ex",e));
          // getRoute geometrie pro jeden
          const v=veh.find(v=>idx.get(v.psi)?.routes.get(String(v.rn)));
          const rid=idx.get(v.psi).routes.get(String(v.rn)).id;
          const r=await fetch(`${B}/getRoute`,{method:"POST",headers:{"content-type":"application/x-www-form-urlencoded","referer":"https://dpmhk.qrbus.me/","x-requested-with":"XMLHttpRequest"},body:JSON.stringify({lineId:v.psi,routeId:rid})});
          const g=await r.json();const L=g.lines?.[0];const route=L?.routes?.find(x=>x.id===rid)||L?.routes?.[0];
          const segs=(route?.segments||[]).slice().sort((a,b)=>a.segmentOrder-b.segmentOrder);
          let pts=0;for(const s of segs)pts+=(s.points||[]).length;
          console.log("PG getRoute",r.status,"segmenty",segs.length,"bodů",pts,"cíl",route?.endName);
          // stops
          const st=JSON.parse(require("fs").readFileSync("stops.json"));
          const sarr=st.stops||st;console.log("PG stops",Array.isArray(sarr)?sarr.length:"?","sample",JSON.stringify((sarr[0]||{})).slice(0,120));
          })()
          '
