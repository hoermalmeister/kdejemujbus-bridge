name: GTFS probe
on:
  push:
    branches: ['probe/gtfs-feed']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: diag
        run: |
          P=https://hoermalmeister.github.io/kdejemujbus-bridge
          for l in 265101 265102 265130 265161 265170 265171 265104 265105 265103 265112; do
            curl -sS -m 25 -o /dev/null -w "PG pages $l %{http_code} %{size_download}B\n" "$P/match/$l.json"
          done
          # matcher proti Pages (default BASE), na živých vozech
          curl -sS -m 20 "https://preparator.eternal.cz/services/mboleslav/bus_positions?guid=146&ext=MBoleslav2" > live.xml
          node --input-type=module -e '
          import {parseDpmlbVehicles} from "./lib/dpmlbParser.js";
          import {matchDpmlb} from "./lib/dpmlbMatch.js";
          import {readFileSync} from "fs";
          const v=parseDpmlbVehicles(readFileSync("live.xml","utf8"));
          let ok=0;for(const b of v){const m=await matchDpmlb(b.fullLine,b.lat,b.lng,b.delay||0);if(m)ok++;console.log("PG m",b.line,b.fullLine,m?("run "+m.run):"NULL");}
          console.log("PG matcher",ok,"/",v.length);'
