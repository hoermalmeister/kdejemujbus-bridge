name: GTFS probe
on:
  push:
    branches: ['probe/gtfs-feed']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { ref: feat/portabo3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --silent
      - name: build + server
        run: |
          curl -fsSL --retry 3 -o feed.zip https://motis.obehy.cz/get-feeds/cz-jdf-gtfs.zip
          python3 scripts/build_route_shapes.py feed.zip site >/dev/null 2>&1
          echo "PG match595 $(ls site/match|grep -c '^595')"
          ( cd site && python3 -m http.server 8000 >/dev/null 2>&1 & ) ; sleep 2
          DPMLB_ROUTES_BASE=http://localhost:8000 PORT=3999 node server.js > s.log 2>&1 &
          sleep 8
          node -e '
          (async()=>{const B="http://localhost:3999";
          const d=await (await fetch(`${B}/dpmul`)).json();
          let tt=0,rt=0;const bad=[];
          for(const v of d){const t=await fetch(`http://localhost:8000/timetables/${v.cis}_${v.spoj}.json`).then(r=>r.ok?r.json():null).catch(()=>null);const r=await fetch(`http://localhost:8000/routes/${v.cis}.json`).then(r=>r.ok?r.json():null).catch(()=>null);if(t)tt++;else bad.push(v.cis+"/"+v.spoj);if(r?.trips?.[v.spoj])rt++;}
          console.log("PG DPMÚL n",d.length,"řád",tt,"trasa",rt,"bezŘádu",bad.slice(0,6).join(","));
          })()'
          grep -iE "error|chyba" s.log | head -3 | sed 's/^/PG log /'
