name: GTFS probe
on:
  push:
    branches: ['probe/gtfs-feed']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: { ref: feat/dpmlb-dir }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --silent
      - name: build + server
        run: |
          curl -fsSL --retry 3 -o feed.zip https://motis.obehy.cz/get-feeds/cz-jdf-gtfs.zip
          python3 scripts/build_route_shapes.py feed.zip site >/dev/null 2>&1
          head -c 120 site/match/265162.json | sed 's/^/PG matchsample /'; echo
          ( cd site && python3 -m http.server 8000 >/dev/null 2>&1 & ) ; sleep 2
          DPMLB_ROUTES_BASE=http://localhost:8000 PORT=3999 node server.js > s.log 2>&1 &
          sleep 8
          node -e '
          (async()=>{const d=await (await fetch("http://localhost:3999/dpmlb")).json();
          console.log("PG dpmlb",d.length,"s_run",d.filter(v=>v.run!=null).length);
          for(const v of d.filter(x=>/^2651/.test(x.fullLine)&&(x.line.length<=2))) {}
          for(const v of d)console.log("PG v","linka",v.line,"run",v.run??"-","cíl",JSON.stringify(v.destination));
          })()'
