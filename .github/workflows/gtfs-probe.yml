name: GTFS probe
on:
  push:
    branches: ['probe/gtfs-feed']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait + prod
        run: |
          for i in 1 2 3 4 5 6; do
            curl -sS -m 25 "https://grapp-bridge-production.up.railway.app/dpmlb" -o d.json
            node -e 'const d=JSON.parse(require("fs").readFileSync("d.json"));const r=d.filter(v=>v.run!=null).length;console.log("PG try '"$i"' vozů",d.length,"s_run",r);if(r>0){const v=d.find(x=>x.run!=null);console.log("PG ok",v.line,"run",v.run,"zast#",v.stopIndex,"cíl",v.destination);process.exit(0)}process.exit(1)' && break
            sleep 40
          done
