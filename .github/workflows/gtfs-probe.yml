name: GTFS probe
on:
  push:
    branches: ['probe/gtfs-feed']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: idpk
        run: |
          curl -sS -m 20 "https://pvvd.idpk.cz/Ajax/GetPoints" > raw.json
          curl -sS -m 20 "https://grapp-bridge-production.up.railway.app/idpk" > prod.json
          node -e '
          const raw=JSON.parse(require("fs").readFileSync("raw.json"));
          const arr=Array.isArray(raw)?raw:(raw.data||raw.points||[]);
          const prod=JSON.parse(require("fs").readFileSync("prod.json"));
          console.log("PG zdroj vozů",arr.length,"| produkce po filtru",Array.isArray(prod)?prod.length:JSON.stringify(prod).slice(0,80));
          console.log("PG pole vozu",JSON.stringify(arr[0]));
          // jaké klíče zdroj dává (hledáme příznak mimo provoz/traction)
          console.log("PG klíče",[...new Set(arr.flatMap(v=>Object.keys(v)))].join(","));
          const tr={};for(const v of arr){tr[v.traction||"?"]=(tr[v.traction||"?"]||0)+1}
          console.log("PG traction",JSON.stringify(tr));
          // kolik má prázdný text/linku
          console.log("PG bezText",arr.filter(v=>!v.text).length,"bezLatLng",arr.filter(v=>!v.lat||!v.lng).length);
          '
