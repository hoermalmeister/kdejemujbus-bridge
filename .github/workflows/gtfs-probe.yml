name: GTFS probe
on:
  push:
    branches: ['probe/gtfs-feed']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: { ref: feat/dszo-idzk }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --silent
      - name: server
        run: |
          PORT=3999 node server.js > s.log 2>&1 &
          sleep 8
          node -e '
          (async()=>{const B="http://localhost:3999";
          const d=await (await fetch(`${B}/dszo`)).json();
          const withIdzk=d.filter(v=>v.idzk);
          console.log("PG dszo",d.length,"sIDZK",withIdzk.length);
          console.log("PG v0",JSON.stringify(withIdzk[0]));
          const v=withIdzk[0];
          const q=new URLSearchParams({num1:v.idzk.line,num2:v.idzk.run,cat:v.idzk.cat}).toString();
          const r=await fetch(`${B}/mpv/zlin/route?${q}`);const t=await r.json();
          console.log("PG trasa",r.status,"shape",t.shape?.length,"spoj",v.spoj);
          })()'
          grep -iE "dszo|error|chyba" s.log | head -3 | sed 's/^/PG log /'
