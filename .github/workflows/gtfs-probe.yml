name: GTFS probe
on:
  push:
    branches: ['probe/gtfs-feed']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: prod
        run: |
          for i in 1 2 3; do
            curl -sS -m 25 "https://grapp-bridge-production.up.railway.app/dpmlb" -o d.json
            node -e 'const d=JSON.parse(require("fs").readFileSync("d.json"));console.log("PG try '"$i"' vozů",d.length,"s_run",d.filter(v=>v.run!=null).length)'
            sleep 15
          done
          node -e 'const d=JSON.parse(require("fs").readFileSync("d.json"));for(const v of d.slice(0,6))console.log("PG v",v.line,"run",v.run??"-","zast#"+(v.stopIndex??"-"),"cíl",v.destination)'
