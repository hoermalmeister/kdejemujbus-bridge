name: GTFS probe
on:
  push:
    branches: ['probe/gtfs-feed']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: align
        run: |
          curl -sS -m 20 "https://tabule.portabo.cz/api/v1-tabule/cis/GetTraffic/0" > t.json
          curl -fsSL --retry 3 -o feed.zip https://motis.obehy.cz/get-feeds/cz-jdf-gtfs.zip
          python3 - <<'PY'
          import json,zipfile,csv,io,collections
          d=json.load(open("t.json"))["VehicleList"]
          def spoj(v): return v["qride_tripID"].split("-")[-1]
          want={}  # (line,spoj) -> count
          for v in d:
              c=str(v["CISLineID"])
              if c.startswith(("595","585")):
                  want[(c,spoj(v))]=want.get((c,spoj(v)),0)+1
          print("PG párů",len(want),"595",sum(1 for k in want if k[0].startswith("595")),"585",sum(1 for k in want if k[0].startswith("585")))
          z=zipfile.ZipFile("feed.zip")
          def rows(n):
              with z.open(n) as r: yield from csv.DictReader(io.TextIOWrapper(r,encoding="utf-8-sig"))
          names={}  # trip_short_name set for 595/585
          shorts=set()
          heads={}
          for t in rows("trips.txt"):
              sn=t.get("trip_short_name","")
              p=sn.split()
              if len(p)==2 and p[0].startswith(("595","585")):
                  shorts.add((p[0],p[1])); heads[(p[0],p[1])]=t.get("trip_headsign","")
          print("PG GTFS 595/585 spojů",len(shorts))
          hit=[k for k in want if k in shorts]
          print("PG shoda",len(hit),"/",len(want))
          miss595=[k for k in want if k[0].startswith("595") and k not in shorts][:5]
          miss585=[k for k in want if k[0].startswith("585") and k not in shorts][:5]
          print("PG miss595",miss595)
          print("PG miss585",miss585)
          for k in hit[:4]:
              print("PG hit",k,"->",heads.get(k))
          PY
