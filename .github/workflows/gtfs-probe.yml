name: GTFS probe
on:
  push:
    branches: ['probe/gtfs-feed']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: match
        run: |
          B=https://tabule.portabo.cz/api/v1-tabule/cis
          for i in 1 2 3; do curl -sS -m 25 "$B/GetTraffic/0" > t.json; s=$(wc -c < t.json); echo "PG traffic try$i $s B"; [ "$s" -gt 1000 ] && break; sleep 5; done
          curl -sS -m 40 "$B/GetStations" > st.json
          curl -fsSL --retry 3 -o feed.zip https://motis.obehy.cz/get-feeds/cz-jdf-gtfs.zip
          python3 - <<'PY'
          import json,zipfile,csv,io
          tj=json.load(open("t.json")); d=tj.get("VehicleList",[])
          print("PG vozů celkem",len(d))
          stations={}
          for s in json.load(open("st.json"))["ItemList"]:
              if s.get("Name"): stations.setdefault(s["Node"], s["Name"])
          print("PG uzlů",len(stations))
          z=zipfile.ZipFile("feed.zip")
          def rows(n):
              with z.open(n) as r: yield from csv.DictReader(io.TextIOWrapper(r,encoding="utf-8-sig"))
          gtfs=set()
          for t in rows("trips.txt"):
              p=t.get("trip_short_name","").split()
              if len(p)==2 and p[0].startswith(("595","585")): gtfs.add((p[0],p[1]))
          print("PG gtfs 595/585 spojů",len(gtfs))
          for op,pref in [("DPMUL","595"),("MDT","585")]:
              vs=[v for v in d if str(v["CISLineID"]).startswith(pref)]
              if not vs: print("PG",op,"n=0"); continue
              byRoute=sum(1 for v in vs if (str(v["CISLineID"]),str(v["RouteID"])) in gtfs)
              byLast=sum(1 for v in vs if (str(v["CISLineID"]),v["qride_tripID"].split("-")[-1]) in gtfs)
              fin=sum(1 for v in vs if v["FinalNode"] in stations)
              cur=sum(1 for v in vs if v["StationNode"] in stations)
              diff=sum(1 for v in vs if str(v["LineID"])!=str(v["qride_linename"]))
              print(f"PG {op} n={len(vs)} RouteID_GTFS={byRoute} last_GTFS={byLast} finalName={fin} curName={cur} LineID!=name={diff}")
              ex=vs[0]
              print(f"PG {op} ex LineID={ex['LineID']} name={ex['qride_linename']} RouteID={ex['RouteID']} final={stations.get(ex['FinalNode'])} cur={stations.get(ex['StationNode'])}")
          PY
