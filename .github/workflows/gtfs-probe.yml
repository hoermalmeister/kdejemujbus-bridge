name: GTFS probe
on:
  push:
    branches: ['probe/gtfs-feed']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: overlap
        run: |
          curl -sS -m 20 "https://tabule.portabo.cz/api/v1-tabule/cis/GetTraffic/0" > p.json
          curl -sS -m 20 "https://grapp-bridge-production.up.railway.app/duk" > duk.json
          node -e '
          const p=JSON.parse(require("fs").readFileSync("p.json")).VehicleList||[];
          const duk=JSON.parse(require("fs").readFileSync("duk.json"));
          const dukArr=Array.isArray(duk)?duk:(duk.VehicleList||duk.vehicles||duk.data||[]);
          console.log("PG duk vozů",dukArr.length,"klíče",JSON.stringify(Object.keys(dukArr[0]||{})).slice(0,300));
          console.log("PG dukSample",JSON.stringify(dukArr[0]).slice(0,260));
          const port585_595=p.filter(v=>String(v.CISLineID).startsWith("595")||String(v.CISLineID).startsWith("585"));
          // překryv podle ID
          const dukIds=new Set(dukArr.map(v=>String(v.ID??v.id??v.Id)));
          const both=port585_595.filter(v=>dukIds.has(String(v.ID)));
          console.log("PG portabo595_585",port585_595.length,"dukMáStejnéID",both.length);
          // kolik DÚK vozů má CISLine 595/585
          const dukCis=dukArr.map(v=>String(v.CISLineID??v.cis??"")).filter(c=>c.startsWith("595")||c.startsWith("585"));
          console.log("PG dukSe595_585",dukCis.length);
          '
