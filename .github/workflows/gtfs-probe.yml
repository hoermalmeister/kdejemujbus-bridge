name: GTFS probe
on:
  push:
    branches: ['probe/gtfs-feed']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: { ref: feat/tsmk }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --silent
      - name: server
        run: |
          PORT=3999 node server.js > s.log 2>&1 &
          sleep 8
          node -e '
          (async()=>{const B="http://localhost:3999";
          const d=await (await fetch(`${B}/tsmk`)).json();
          console.log("PG tsmk",Array.isArray(d)?d.length:JSON.stringify(d).slice(0,120));
          if(Array.isArray(d)&&d.length){console.log("PG v0",JSON.stringify(d[0]));
          console.log("PG heading",d.filter(v=>v.heading!=null).length,"delaynull",d.filter(v=>v.delay==null).length);
          const v=d[0];
          const t=await (await fetch(`${B}/tsmk/trip?line=${v.line}&connection=${v.run}`)).json();
          console.log("PG trip",v.line,v.run,"stops",t.stops?.length,"shape",t.shape?.length,JSON.stringify(t.stops?.slice(0,2)),JSON.stringify(t.shape?.slice(0,2)));
          const idx=t.stops?.findIndex(s=>s.id===v.stopNumber);console.log("PG curIdx",idx,"stopNumber",v.stopNumber,"stop",v.stop);
          }})()'
          grep -iE "tsmk|error|chyba" s.log | head -4 | sed 's/^/PG log /'
