name: GTFS probe
on:
  push:
    branches: ['probe/gtfs-feed']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: raw
        run: |
          curl -sS -m 20 "https://preparator.eternal.cz/services/mboleslav/bus_positions?guid=146&ext=MBoleslav2" > live.xml
          node -e '
          const s=require("fs").readFileSync("live.xml","utf8");
          for(const m of s.matchAll(/<Item\s+([\s\S]*?)\/>/g)){
            const a=Object.fromEntries([...m[1].matchAll(/(\w+)="([^"]*)"/g)].map(x=>[x[1],x[2]]));
            console.log("PG",JSON.stringify(a.title),JSON.stringify((a.text||"").replace(/&lt;/g,"<").replace(/&gt;/g,">")));
          }'
